<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hardware Lab // Alan Joshy</title>
  <meta name="description"
    content="Custom hardware, home automation, ambient lighting, and student electronics builds by Alan Joshy." />
  <meta name="theme-color" content="#EDE6D6" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="hardware-lab.css" />
</head>

<body class="hw-body">

  <!-- ============ TOP BAR ============ -->
  <header class="hw-top-bar">
    <div class="hud-left">
      <a href="index.html#lab" class="hud-back-btn" aria-label="Return to portfolio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
        <span>Alan.</span>
      </a>
      <div class="hud-title-wrap">
        <span class="hud-eyebrow">Hardware Lab</span>
        <h1 class="hud-title">Things I've wired together</h1>
      </div>
    </div>

    <!-- Theme Toggle -->
    <div class="hud-right">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="4.2" />
          <path
            d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7" />
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.7 14.6a8.6 8.6 0 0 1-10.3-10.3 8.9 8.9 0 1 0 10.3 10.3z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- ============ MAIN VIEWPORT (60% Stage / 40% Description) ============ -->
  <main class="hw-viewport" id="hwViewport">

    <!-- 60% Left / Center Visual Stage -->
    <section class="hw-stage-container">
      
      <!-- Subtle Millimeter Grid -->
      <div class="hw-grid-bg"></div>

      <!-- Floating 3D Showcase Assembly -->
      <div class="hw-card-assembly" id="hwCardAssembly">
        
        <!-- Physical Photo Display Card -->
        <div class="hw-photo-card" id="photoCard">
          <img src="images/hardware/ambient-light.jpg" alt="Hardware Project" class="hw-main-img" id="mainImg" />
          
          <!-- Interactive Dot Hotspots -->
          <div class="hw-hotspots-layer" id="hotspotsLayer">
            <!-- Dynamically populated minimal dot hotspots -->
          </div>
        </div>

        <!-- Soft Shadow Floor Ring -->
        <div class="hw-base-shadow"></div>

      </div>

      <!-- Bottom Build Selector Dock (6 Options) -->
      <nav class="hw-dock" aria-label="Select hardware build">
        <button class="dock-btn is-active" data-build="ambient">
          <span class="dock-num">01</span>
          <span class="dock-label">Ambient Light</span>
        </button>
        <button class="dock-btn" data-build="mist">
          <span class="dock-num">02</span>
          <span class="dock-label">Mist Sprayer</span>
        </button>
        <button class="dock-btn" data-build="tank">
          <span class="dock-num">03</span>
          <span class="dock-label">Tank Dashboard</span>
        </button>
        <button class="dock-btn" data-build="outdoor">
          <span class="dock-num">04</span>
          <span class="dock-label">Outdoor Light</span>
        </button>
        <button class="dock-btn" data-build="theatre">
          <span class="dock-num">05</span>
          <span class="dock-label">5.1 Sound</span>
        </button>
        <button class="dock-btn" data-build="student">
          <span class="dock-num">06</span>
          <span class="dock-label">Student Projects</span>
        </button>
      </nav>

    </section>

    <!-- 40% Right-Side Clean Description Panel -->
    <aside class="hw-dossier-panel" id="dossierPanel">
      <div class="dossier-scroll-content">
        
        <div class="dossier-header-row">
          <span class="dossier-tag" id="dossierTag">Desktop &amp; Optics</span>
          <span class="dossier-index" id="dossierIndex">01 / 05</span>
        </div>

        <h2 class="dossier-heading" id="dossierTitle">Desktop Ambient Monitor Light</h2>

        <!-- Simple Conversational Narrative -->
        <div class="dossier-section">
          <h3 class="section-label">What It Does</h3>
          <p class="dossier-body" id="dossierSummary"></p>
        </div>

        <div class="dossier-section">
          <h3 class="section-label">Why I Built It</h3>
          <p class="dossier-body" id="dossierStory"></p>
        </div>

        <div class="dossier-section">
          <h3 class="section-label">Real-World Highlights</h3>
          <ul class="dossier-highlights" id="dossierHighlights"></ul>
        </div>

        <!-- Direct WhatsApp Action CTA -->
        <div class="dossier-action-wrap">
          <a href="#" target="_blank" rel="noopener" class="btn-whatsapp-order" id="whatsappOrderBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M12.031 2C6.496 2 2 6.484 2 12.015c0 1.947.556 3.763 1.516 5.305L2.05 22l4.832-1.43c1.477.838 3.183 1.314 5.149 1.314 5.535 0 10.03-4.484 10.03-10.015C22.062 6.484 17.566 2 12.031 2zm5.834 14.28c-.244.686-1.22 1.26-1.708 1.306-.474.045-.98.077-3.125-.81-2.274-.941-3.714-3.26-3.829-3.414-.114-.153-.915-1.218-.915-2.323 0-1.106.58-1.648.786-1.877.206-.23.45-.286.6-.286.152 0 .305.003.435.01.138.007.32.02.488.428.176.427.603 1.472.656 1.58.053.107.091.237.015.39-.076.153-.114.244-.229.382-.114.137-.244.305-.351.412-.122.122-.252.252-.107.504.145.252.648 1.07 1.39 1.732.953.85 1.754 1.114 2.006 1.236.252.122.397.107.542-.061.145-.168.618-.725.786-.977.168-.252.336-.214.565-.13.23.084 1.45.687 1.702.81.252.122.42.183.48.286.062.107.062.618-.182 1.304z"/>
            </svg>
            <span id="orderBtnText">Order / Inquire on WhatsApp</span>
          </a>
        </div>

      </div>
    </aside>

    <!-- Floating Pinpoint Tooltip -->
    <div class="hw-pin-popover" id="pinPopover">
      <h4 class="popover-title" id="popoverTitle">Feature</h4>
      <p class="popover-desc" id="popoverDesc">Description</p>
    </div>

  </main>

  <script src="hardware-lab.js"></script>
</body>

</html>
