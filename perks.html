<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perks // Alan Joshy</title>
  <meta name="description" content="A private collection of links and perks for friends & family." />
  <meta name="theme-color" content="#EDE6D6" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/perks.css" />
</head>

<body class="fmp-body">

  <!-- ============ TOP BAR ============ -->
  <header class="fmp-top-bar">
    <a href="index.html" class="hud-back-btn" aria-label="Return to portfolio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      <span>Alan.</span>
    </a>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle color theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="4.2" />
        <path
          d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20.7 14.6a8.6 8.6 0 0 1-10.3-10.3 8.9 8.9 0 1 0 10.3 10.3z" />
      </svg>
    </button>
  </header>

  <!-- ============ MAIN CONTENT CONTAINER ============ -->
  <main class="fmp-main">
    <div class="fmp-card">

      <!-- 1. Password Gate (Shown when locked) -->
      <section class="gate-view" id="gateView">
        <div class="gate-icon-wrap">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="18" height="11" x="3" y="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </div>

        <div class="gate-header">
          <h1 class="gate-title">Perks</h1>
          <p class="gate-desc">This bit's just for the people I actually know.</p>
        </div>

        <form class="gate-form" id="gateForm">
          <div class="gate-input-wrap">
            <input type="password" id="gatePassword" class="gate-input" required placeholder="Enter passcode"
              autocomplete="current-password" />
          </div>
          <p class="gate-error" id="gateError">Incorrect passcode. Ping Alan if you forgot it.</p>
          <button type="submit" class="btn-cta btn-full">Come on in</button>
        </form>
      </section>

      <!-- 2. Private Content Hub (Revealed when unlocked) -->
      <section class="content-view" id="contentView">
        <div class="content-header">
          <h2 class="content-title">Welcome in.</h2>
          <p class="content-desc">Photos, some videos, and whatever else I feel like sharing.</p>
        </div>

        <!-- Dynamically rendered links from js/perks.js -->
        <div class="fmp-links-list" id="fmpLinksList"></div>

        <div class="content-footer">
          <button type="button" class="lock-btn" id="lockVaultBtn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Log out</span>
          </button>
          <span style="font-family:var(--font-mono);font-size:0.75rem;color:var(--fg-dim);">Alan Joshy</span>
        </div>
      </section>

    </div>
  </main>

  <script src="js/perks.js" defer></script>
</body>

</html>
