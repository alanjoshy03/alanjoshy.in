[build]
  publish = "."

# Force 301 redirect from .html to clean URLs
[[redirects]]
  from = "/hardware-lab.html"
  to = "/hardware-lab"
  status = 301
  force = true

[[redirects]]
  from = "/journal-map.html"
  to = "/journal-map"
  status = 301
  force = true

[[redirects]]
  from = "/perks.html"
  to = "/perks"
  status = 301
  force = true

[[redirects]]
  from = "/for-my-people.html"
  to = "/perks"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Clean URL routing (200 rewrites)
[[redirects]]
  from = "/hardware-lab"
  to = "/hardware-lab.html"
  status = 200

[[redirects]]
  from = "/journal-map"
  to = "/journal-map.html"
  status = 200

[[redirects]]
  from = "/for-my-people"
  to = "/perks.html"
  status = 200

[[redirects]]
  from = "/perks"
  to = "/perks.html"
  status = 200

# Cache-Control headers for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
