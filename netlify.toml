[build]
  publish = "."

# Clean URL routing
[[redirects]]
  from = "/hardware-lab"
  to = "/hardware-lab.html"
  status = 200

[[redirects]]
  from = "/journal-map"
  to = "/journal-map.html"
  status = 200

[[redirects]]
  from = "/for-my-people"
  to = "/for-my-people.html"
  status = 200

[[redirects]]
  from = "/perks"
  to = "/for-my-people.html"
  status = 200

# Cache-Control headers for static assets
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

